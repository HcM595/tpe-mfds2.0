function movingAverage(points,n){
  if(!points||points.length<n)return null;
  return sum(points.slice(-n).map(x=>x.close))/n;
}
function calcRsi14(points){
  if(!points||points.length<15)return null;
  let gains=0,losses=0;
  for(let i=1;i<=14;i++){
    const d=points[i].close-points[i-1].close;
    gains+=Math.max(d,0);losses+=Math.max(-d,0);
  }
  let ag=gains/14,al=losses/14;
  for(let i=15;i<points.length;i++){
    let d=points[i].close-points[i-1].close;
    ag=(ag*13+Math.max(d,0))/14;
    al=(al*13+Math.max(-d,0))/14;
  }
  if(al===0)return ag===0?50:100;
  return 100-100/(1+ag/al);
}
function emaFull(values,n){
  if(values.length<n)return [];
  const k=2/(n+1),out=Array(n-1).fill(null);
  let e=sum(values.slice(0,n))/n;
  out.push(e);
  for(let i=n;i<values.length;i++){e=values[i]*k+e*(1-k);out.push(e)}
  return out;
}
function calcMacd(points){
  if(!points||points.length<35)return null;
  const close=points.map(p=>p.close),a=emaFull(close,12),b=emaFull(close,26);
  const diff=close.map((_,i)=>a[i]!==null&&b[i]!==null?a[i]-b[i]:null);
  const signal=emaFull(diff.filter(x=>x!==null),9);
  if(!signal.length)return null;
  let d=diff.at(-1),sig=signal.at(-1);
  return {macd:d,signal:sig,hist:d-sig};
}

function rankTable(rows,n){if(!rows.length)return'<div class="empty">沒有符合條件的股票。可調低成交金額門檻或清除搜尋條件。</div>';let list=rows.slice(0,n);return `<div class="table-wrap"><table class="data-table"><thead><tr><th>股票代碼／名稱</th><th>產業</th><th>價格</th><th>${state.mode==='official'?'當日成交額':'20日均成交額'}</th><th>大戶4週變化</th><th>籌碼狀態</th><th>因子得分</th><th class="col-action">自選</th></tr></thead><tbody>${list.map(s=>`<tr data-stock="${esc(s.stock_id)}"><td><span class="ticker">${esc(s.stock_id)}</span><span class="nm">${esc(s.stock_name)}</span></td><td>${esc(s.sector)}</td><td class="num">${fmt(s.close,2)}</td><td class="num">${(state.mode==='official'?s.trade_value_twd:s.avg_trade_value_twd)===null?'—':fmt((state.mode==='official'?s.trade_value_twd:s.avg_trade_value_twd)/100000000,2)+' 億'}</td><td class="num ${s.large_holder_change_pp===null?'neutral':s.large_holder_change_pp>0?'up':'down'}">${s.large_holder_change_pp===null?'—':(s.large_holder_change_pp>0?'+':'')+fmt(s.large_holder_change_pp,2)+' pp'}</td><td>${chipBadge(s.stock_id)}</td><td>${scoreMarkup(s)}</td><td><button class="btn mini" data-action="watch" data-id="${esc(s.stock_id)}" title="加入或移除自選">${state.watch.includes(s.stock_id)?'★':'☆'}</button></td></tr>`).join('')}</tbody></table></div>`}

function overviewView(){let rows=rowsFiltered(),valid=rows.filter(s=>s.calc.total!==null),top=rows[0],sectors=sectorStats();return `<div class="grid4"><div class="stat"><small>目前股票筆數</small><strong>${fmt(state.stocks.length)}</strong><span>${state.mode==='demo'?'示範股票，不是全市場':(state.mode==='official'?'最新官方收盤資料':'已匯入資料')}</span></div><div class="stat"><small>篩選符合條件</small><strong>${fmt(rows.length)}</strong><span>依目前成交額門檻（官方模式為當日）</span></div><div class="stat"><small>因子資料達標</small><strong>${fmt(valid.length)}</strong><span>≥9/12 因子且每層≥2</span></div><div class="stat"><small>前段綜合分數</small><strong>${top?.calc.total===null||!top?'—':fmt(top.calc.total,1)}</strong><span>分數非上漲機率</span></div></div><div class="layout2"><section class="card"><div class="card-head"><div><h2>因子綜合排名</h2><div class="hint">研究用相對評分 · ${state.mode==='demo'?'虛構示範':(state.mode==='official'?'官方收盤資料':'匯入資料')}</div></div><button class="btn mini" data-action="nav" data-target="screener">全部查看 →</button></div>${rankTable(rows,8)}</section><section class="card"><div class="card-head"><div><h2>產業平均因子分數</h2><div class="hint">產業內有資料股票的平均分數</div></div></div><div class="sect-bars">${sectors.length?sectors.map(x=>`<div class="sect-row"><span>${esc(x.name)}</span><div class="meter"><span style="width:${fmt(x.score,1)}%"></span></div><b>${fmt(x.score,1)}</b></div>`).join(''):'<div class="empty">尚無足夠資料可計算產業分數</div>'}</div><div class="note-box">⚑ 僅用於分數比較，不是未來報酬預測；產業間的樣本數可能差距很大。</div></section></div><div class="layout2"><section class="card"><div class="card-head"><h2>從哪裡開始？</h2></div><div class="steps"><div class="step"><div class="stepnum">1</div><div><strong>先體驗示範股票</strong><p>點選表格任一列，體驗個股評分與價格圖。</p></div></div><div class="step"><div class="stepnum">2</div><div><strong>匯入有來源的CSV</strong><p>在「資料與操作說明」頁下載範例，選檔即可匯入。</p></div></div><div class="step"><div class="stepnum">3</div><div><strong>檢查因子覆蓋率</strong><p>只有至少9個有效因子、每層至少2個時才列入正式排名。</p></div></div></div></section><section class="card"><h2>模型原則</h2><p class="subtle">保留原始 function screenerView(){let rows=rowsFiltered(),sectors=['全部產業',...new Set(state.stocks.map(s=>s.sector))].sort((a,b)=>a==='全部產業'?-1:b==='全部產業'?1:a.localeCompare(b,'zh'));let markets=['全部市場',...new Set(state.stocks.map(s=>s.market))];return `<div class="section-head"><div><h2>股票清單</h2><span class="hint">符合條件 ${rows.length} 檔，全部資料 ${state.stocks.length} 檔</span></div><button class="btn" data-action="export">↓ 匯出 CSV</button></div><section class="card"><div class="toolbar"><input class="field search" id="q" placeholder="輸入代號、名稱或產業..." value="${esc(state.search)}"><select class="field" id="sector">${sectors.map(x=>`<option ${x===state.sector?'selected':''}>${esc(x)}</option>`).join('')}</select><select class="field" id="market">${markets.map(x=>`<option ${x===state.market?'selected':''}>${esc(x)}</option>`).join('')}</select><select class="field" id="chipFilter" aria-label="籌碼條件"><option value="all" ${state.chipFilter==='all'?'selected':''}>全部股票</option><option value="matched" ${state.chipFilter==='matched'?'selected':''}>法人與大戶同步增持</option><option value="insufficient" ${state.chipFilter==='insufficient'?'selected':''}>籌碼資料不足</option></select><select class="field" id="sort"><option value="score" ${state.sort==='score'?'selected':''}>依綜合分數</option><option value="turnover" ${state.sort==='turnover'?'selected':''}>依成交金額</option><option value="holder" ${state.sort==='holder'?'selected':''}>依大戶變化</option><option value="name" ${state.sort==='name'?'selected':''}>依股票代號</option></select></div><div class="row" style="margin-bottom:13px"><label class="hint" for="minValue">${state.mode==='official'?'當日成交金額門檻':'20日平均成交額門檻'}</label><select id="minValue" class="field"><option value="0" ${state.minValue===0?'selected':''}>不限</option><option value="10000000" ${state.minValue===10000000?'selected':''}>1,000萬元</option><option value="30000000" ${state.minValue===30000000?'selected':''}>3,000萬元</option><option value="100000000" ${state.minValue===100000000?'selected':''}>1億元</option><option value="300000000" ${state.minValue===300000000?'selected':''}>3億元</option></select><span class="hint">同步增持需有效資料，不代表買進建議；12因子需9/12有效。</span></div>${state.chipFilter==='matched'?`<div class="note-box">目前已選「同步增持」，在原始籌碼CSV中符合條件的有 <strong>${Object.values(state.chipSignals||{}).filter(r=>r.chip_status==='matched').length}</strong> 檔；經現有行情清單及此頁成交額、產業、市場、搜尋條件後顯示 <strong>${rows.length}</strong> 檔。如欲比較CSV原始數量，請將成交額選「不限」，產業／市場切換「全部」，並清除搜尋文字。</div>`:''}${rankTable(rows,150)}<p class="panel-caption">可切換「法人與大戶同步增持」，缺資料不會當作符合。分數＝四層標準化因子的加權平均（0–100）。非AI預測值，未經歷史回測。缺少因子不會被自動補0。</p></section>`}
function buildChart(points){if(!points||points.length<2)return '<div class="empty">尚未匯入這檔股票的歷史價格。可在「資料與操作說明」頁匯入每日價格CSV。</div>';let vals=points.map(p=>p.close),n=vals.length,w=760,h=235,pad={l:50,r:12,t:15,b:28},min=Math.min(...vals),max=Math.max(...vals),range=Math.max(1e-7,max-min),x=i=>pad.l+i/(n-1)*(w-pad.l-pad.r),y=v=>pad.t+(max-v)/range*(h-pad.t-pad.b);let line=vals.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' '),area=`${line} L${x(n-1)},${h-pad.b} L${x(0)},${h-pad.b} Z`,ticks=Array.from({length:5},(_,i)=>min+range*i/4).reverse(),avg=vals.map((_,i)=>i>=19?sum(vals.slice(i-19,i+1))/20:null),avgLine=avg.map((v,i)=>v===null?'':`${avg[i-1]===null?'M':'L'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');return `<div class="plot-box"><svg class="plot" role="img" aria-label="價格走勢示意" viewBox="0 0 ${w} ${h}"><defs><linearGradient id="areaGrad" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#3b94a8" stop-opacity=".23"/><stop offset="1" stop-color="#3b94a8" stop-opacity=".01"/></linearGradient></defs>${ticks.map(v=>`<g><line x1="${pad.l}" x2="${w-pad.r}" y1="${y(v)}" y2="${y(v)}" stroke="#e3eaf0"/><text x="${pad.l-7}" y="${y(v)+4}" fill="#71869a" font-size="11" text-anchor="end">${fmt(v,1)}</text></g>`).join('')}<path d="${area}" fill="url(#areaGrad)"/><path d="${line}" fill="none" stroke="#2d8098" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="${avgLine}" fill="none" stroke="#d69d53" stroke-width="2" stroke-linejoin="round"/> <text x="${pad.l}" y="${h-6}" fill="#8ca0af" font-size="10">${esc(points[0].date)}</text><text x="${w-pad.r}" y="${h-6}" text-anchor="end" fill="#8ca0af" font-size="10">${esc(points.at(-1).date)}</text></svg><div class="legend"><span><i></i> 收盤價</span><span><i class="avg"></i> 20期均線</span></div></div>`}
function factorBreakdown(s){let calc=s.calc;return GROUPS.map(g=>`<div class="factor-group"><div class="factor-hd"><span>${g.name} <span class="hint">${g.description}</span></span><span class="chip">${calc.scores[g.id]===null?'—':fmt(calc.scores[g.id],1)+' 分'}</span></div>${g.cols.map(c=>{let v=num(s.f?.[c]);if(v===null||v< -1||v>1)return `<div class="factor-line"><span>${c} ${FACTOR_NAME[c]}</span><div class="hint">尚無有效值</div><b>—</b></div>`;return `<div class="factor-line"><span>${c} ${FACTOR_NAME[c]}</span><div class="meter"><span class="${v<0?'neg':''}" style="margin-left:${v<0?fmt(50+v*50,1):50}%;width:${fmt(Math.abs(v)*50,1)}%"></span></div><b>${v>0?'+':''}${fmt(v,2)}</b></div>`}).join('')}</div>`).join('')}
function stockView(){let stock=derive().find(x=>x.stock_id===state.current)||derive()[0];if(!stock)return'<section class="card" style="margin-top:20px"><div class="empty">沒有股票資料。請匯入CSV或切換示範。</div></section>';state.current=stock.stock_id;let points=state.prices[stock.stock_id],valid=stock.calc.valid;const options=state.stocks.map(x=>`<option value="${esc(x.stock_id)}" ${stock.stock_id===x.stock_id?'selected':''}>${esc(x.stock_id)} ${esc(x.stock_name)}</option>`).join('');let ret20=points?.length>=21?((points.at(-1).close/points.at(-21).close)-1)*100:null,ma20=points?.length>=20?sum(points.slice(-20).map(x=>x.close))/20:null;return `<div class="section-head"><div class="detail-title"><h2>${esc(stock.stock_id)} · ${esc(stock.stock_name)}</h2><span class="pill">${esc(stock.sector)}</span><span class="pill">${esc(stock.market)}</span></div><div class="row"><input id="stockCodeInput" class="field" inputmode="numeric" placeholder="直接輸入8064等代號" style="width:165px" maxlength="6" aria-label="輸入股票代號"><button class="btn" data-action="findStock">查詢代號</button><select id="stockPick" class="field" aria-label="切換股票">${options}</select><button class="btn" data-action="watch" data-id="${esc(stock.stock_id)}">${state.watch.includes(stock.stock_id)?'★ 已加入自選':'☆ 加入自選'}</button></div></div><div class="grid4" style="margin-top:13px"><div class="stat"><small>綜合因子分數</small><strong>${valid?fmt(stock.calc.total,1):'—'}</strong><span>${valid?'研究分數，非勝率':'資料覆蓋不足'}</span></div><div class="stat"><small>最新匯入收盤價</small><strong>${fmt(stock.close,2)}</strong><span>${esc(stock.asof||'資料日期未提供')}${stock.placeholder?'（無可核實價格）':''}</span></div><div class="stat"><small>大戶持股比率</small><strong>${stock.large_holder_pct===null?'—':fmt(stock.large_holder_pct,1)+'%'}</strong><span>需確認同一持股級距定義</span></div><div class="stat"><small>大戶持股變化</small><strong>${stock.large_holder_change_pp===null?'—':(stock.large_holder_change_pp>0?'+':'')+fmt(stock.large_holder_change_pp,2)}</strong><span>百分點（pp）</span></div></div>${chipStockPanel(stock.stock_id)}<div class="layout2"><section class="card"><div class="card-head"><div><h2>歷史價格走勢</h2><span class="hint">${state.mode==='demo'?'完全虛構的價格走勢':'依已累積或匯入的價格資料繪製'}</span></div></div>${buildChart(points)}<div style="margin-top:14px"><h3>技術指標（2.1新增）</h3>${technicalsView(points)}</div><div class="meta-cards" style="margin-top:15px"><div class="meta-card"><small>20期報酬（若有）</small><b>${ret20===null?'—':(ret20>0?'+':'')+fmt(ret20,2)+'%'}</b></div><div class="meta-card"><small>20期均價</small><b>${fmt(ma20,2)}</b></div><div class="meta-card"><small>法人近5日</small><b>${chipBadge(stock.stock_id)}</b></div></div></section><section class="card"><div class="card-head"><h2>四層因子概況</h2><span class="chip">${stock.calc.count}/12 有效</span></div><div class="sect-bars">${GROUPS.map(g=>`<div class="sect-row"><span>${g.name}</span><div class="meter"><span style="width:${fmt(stock.calc.scores[g.id]||0,1)}%"></span></div><strong>${stock.calc.scores[g.id]===null?'—':fmt(stock.calc.scores[g.id],1)}</strong></div>`).join('')}</div><div class="note-box">本評分用的是可解釋的規則，尚未用真實歷史資料訓練。請勿將高分視為未來一定上漲。</div></section></div><div class="layout2"><section class="card"><div class="card-head"><h2>12因子明細</h2><span class="hint">標準化評分 −1 到 +1</span></div>${factorBreakdown(stock)}</section><section class="card"><h2>預測與風險檢查</h2><div class="note-box" style="margin:15px 0">預測上漲機率、預期報酬與價格區間：<strong>尚未啟用</strong>。必須先以真實歷史資料進行嚴格樣本外回測及機率校準。</div><div class="small-table"><table class="small-table"><tr><th>分析週期</th><td><div class="control-toggle">${[10,20,60].map(d=>`<button data-action="horizon" data-value="${d}" class="${state.horizon===d?'active':''}">${d}日</button>`).join('')}</div></td></tr><tr><th>預測上漲機率</th><td>尚無已驗證模型</td></tr><tr><th>預期報酬</th><td>尚無已驗證模型</td></tr><tr><th>資料覆蓋率</th><td>${stock.calc.count}/12</td></tr><tr><th>模型狀態</th><td>${valid?'可計算描述性評分':'需補資料才可計算評分'}</td></tr></table></div><div class="divider"></div><h3>資料責任提醒</h3><p class="subtle">模型分數是否可信，取決於資料來源、公告日期、歷史調整與回測設計。此頁不提供止損價、買賣點或自動下單。</p></section></div>`}
function watchView(){let list=derive().filter(s=>state.watch.includes(s.stock_id));let absent=state.watch.filter(id=>!state.stocks.some(s=>s.stock_id===id));return `<div class="section-head"><h2>追蹤股票</h2><span class="chip">${state.watch.length} 檔</span></div><section class="card">${list.length?rankTable(list,200):'<div class="empty">自選清單還沒有目前資料集的股票。到「全市場選股」點選☆就能加入。</div>'}${absent.length?`<div class="note-box">下列自選代號尚未存在於目前資料集：${absent.map(esc).join('、')}。可匯入對應CSV資料後查看。</div>`:''}<p class="panel-caption">自選代號只存在於此瀏覽器的本機儲存空間。更換電腦或清除瀏覽器資料可能會遺失。</p></section>`}
function settingsView(){return `<div class="layout2"><section class="card"><h2>資料匯入</h2><p class="subtle">不用安裝Python。可按頁面右上方的『官方最新收盤行情』，或匯入CSV計算排名。官方行情只含基本價格，不含多因子分數。</p><div class="drop" id="drop"><div style="font-size:26px;color:#4a86a2">⇧</div><strong>匯入「因子快照 CSV」</strong><p class="hint">每檔股票一列；包含代碼、名稱、資料日期與M1～S3的標準化因子</p><button class="btn btn-primary" data-action="importSnapshot">選擇因子資料檔</button></div><div class="file-actions" style="margin-top:16px"><button class="btn" data-action="importPrices">匯入每日價格 CSV</button><button class="btn" data-action="export">匯出篩選結果</button></div><p class="note-box">匯入資料只在本機瀏覽器中讀取與運算，不會自動上傳到雲端，也不會自行更新股價。請自行確認合法來源與資料完整性。</p><div class="divider"></div><h3>檔案範例與欄位說明</h3><p class="subtle">下載包中包含「因子快照_示範.csv」與「每日價格_示範.csv」。若用Excel修改，請另存為 UTF-8 CSV。</p><p class="hint">最低必要欄位：stock_id、stock_name、sector、market、close、avg_trade_value_twd、M1～S3。12個因子使用−1～+1尺度。允許缺值，但少於9個有效因子、任一層少於2個時不給總分。</p></section><section class="card"><h2>四層因子權重</h2><p class="subtle">設定只改變規則分數。不是模型重新訓練，也不能視為提高勝率。</p>${GROUPS.map(g=>`<div class="slider-line"><label for="weight-${g.id}">${g.name}</label><input id="weight-${g.id}" type="range" min="0" max="50" step="5" value="${state.weights[g.id]}"><strong>${state.weights[g.id]}</strong></div>`).join('')}<p class="hint">各層原始份數會自動按總和正規化；不能全部設為0。</p><button class="btn" data-action="weightsReset">恢復四層各25%</button><div class="divider"></div><h3>模型出處</h3><p class="subtle">採用原始 TPE-MFDS 台股版所列的四層12個因子：宏觀、產業、公司與市場行為。原文件標題稱「四層九維」，但實際列出了12項，本版以實際因子為準。</p></section></div><div class="section-head"><h2>三步驟開始操作</h2></div><section class="card"><div class="steps"><div class="step"><div class="stepnum">1</div><div><strong>先看總覽和選股排名</strong><p>第一次開啟是「DEMO」示範資料，讓你知道每個功能怎麼用。</p></div></div><div class="step"><div class="stepnum">2</div><div><strong>選擇準備好的CSV檔</strong><p>匯入後，頁面會顯示你檔案裡的股票。預設不會連到證交所下載。</p></div></div><div class="step"><div class="stepnum">3</div><div><strong>點股票代號深入分析</strong><p>查看12因子、集保相關欄位與走勢圖；資料不足時會顯示缺值。</p></div></div></div></section><div class="section-head"><h2>目前版本與下一階段</h2></div><section class="card"><table class="small-table"><thead><tr><th>項目</th><th>目前版本</th><th>正式上線時</th></tr></thead><tbody><tr><td>開啟方式</td><td>本機雙擊HTML展示示範；公開網站由網址開啟</td><td>GitHub Pages部署後有固定網址</td></tr><tr><td>全市場資料</td><td>可顯示部署時下載的上市、上櫃最新收盤行情（若來源可用）</td><td>完整12因子排名仍需串接</td></tr><tr><td>集保／法人</td><td>由CSV提供</td><td>定時取官方合法資料</td></tr><tr><td>10／20／60日預測</td><td>尚未啟用</td><td>完成樣本外驗證後再提供</td></tr><tr><td>資料儲存</td><td>本機暫存；自選代碼保存於瀏覽器</td><td>資料庫＋更新排程</td></tr><tr><td>交易下單</td><td>無</td><td>不列入研究系統範圍</td></tr></tbody></table></section>`}
function bind(){document.querySelectorAll('[data-stock]').forEach(el=>el.addEventListener('click',ev=>{if(ev.target.closest('button'))return;state.current=el.dataset.stock;nav('stock')}));document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',ev=>{ev.stopPropagation();let k=el.dataset.action;if(k==='nav')nav(el.dataset.target);if(k==='findStock')lookupStock($('stockCodeInput')?.value);if(k==='importSnapshot')$('snapshotFile').click();if(k==='importPrices')$('pricesFile').click();if(k==='export')exportCSV();if(k==='weightsReset'){state.weights={M:25,I:25,F:25,S:25};render()}if(k==='horizon'){state.horizon=Number(el.dataset.value);render()}if(k==='watch'){let id=el.dataset.id;state.watch=state.watch.includes(id)?state.watch.filter(x=>x!==id):[...state.watch,id];try{localStorage.setItem(STORAGE,JSON.stringify(state.watch))}catch(e){};render()}}));let q=$('q');if(q)q.addEventListener('input',e=>{state.search=e.target.value;const pos=q.selectionStart;render();let next=$('q');next.focus();next.setSelectionRange(pos,pos)});for(let [id,key,fn] of [['sector','sector',x=>x],['market','market',x=>x],['sort','sort',x=>x],['chipFilter','chipFilter',x=>x],['minValue','minValue',Number]]){let el=$(id);if(el)el.addEventListener('change',e=>{state[key]=fn(e.target.value);render()})}let rankInput=$('rankSearch');if(rankInput)rankInput.addEventListener('input',e=>{state.rankSearch=e.target.value;const pos=rankInput.selectionStart;render();let next=$('rankSearch');if(next){next.focus();next.setSelectionRange(pos,pos)}});
let rankCheckbox=$('rankOnlyTech');if(rankCheckbox)rankCheckbox.addEventListener('change',e=>{state.rankOnlyTech=e.target.checked;render()});
let codeInput=$('stockCodeInput');if(codeInput)codeInput.addEventListener('keydown',e=>{if(e.key==='Enter')lookupStock(codeInput.value)});let pick=$('stockPick');if(pick)pick.addEventListener('change',e=>{state.current=e.target.value;render()});for(let g of GROUPS){let slider=$('weight-'+g.id);if(slider)slider.addEventListener('change',e=>{let v=Number(e.target.value);let next={...state.weights,[g.id]:v};if(sum(Object.values(next))===0){notif('權重不可全部設為0');render();return}state.weights=next;render()})}let drop=$('drop');if(drop){drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('drag')});drop.addEventListener('dragleave',()=>drop.classList.remove('drag'));drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('drag');if(e.dataTransfer.files.length)readSnapshot(e.dataTransfer.files[0])})}}
function parseCSV(text){let out=[],row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()!==''))out.push(row);row=[];cell=''}else cell+=c}if(quoted)throw Error('CSV引號沒有正確結束');row.push(cell);if(row.some(x=>x.trim()!==''))out.push(row);return out}
const aliases={'股票代號':'stock_id','股票名稱':'stock_name','產業':'sector','市場':'market','收盤價':'close','漲跌幅(%)':'change_pct','20日均成交額(元)':'avg_trade_value_twd','資料日期':'asof','大戶持股率(%)':'large_holder_pct','大戶持股週變化(pp)':'large_holder_change_pp','外資近5日淨買超(元)':'foreign_5d_net_twd','日期':'date','成交股數':'volume_shares'};
function csvObjects(text){let rows=parseCSV(text.replace(/^\uFEFF/,''));if(rows.length<2)throw Error('檔案沒有資料列');let cols=rows[0].map(x=>aliases[x.trim()]||x.trim());let result=rows.slice(1).map(r=>Object.fromEntries(cols.map((k,i)=>[k,(r[i]??'').trim()])));return result}
async function fileText(file){if(!file||!file.name.toLowerCase().endsWith('.csv'))throw Error('請選取CSV檔');if(file.size>7*1024*1024)throw Error('檔案超過7MB，請分批匯入');return file.text()}
async function readSnapshot(file){try{let objs=csvObjects(await fileText(file));if(objs.length>20000)throw Error('股票列數過多，請檢查CSV格式');let stocks=[],bad=0;for(let o of objs){if(!o.stock_id||!o.stock_name){bad++;continue}let f={};for(let k of Object.keys(FACTOR_NAME)){let v=num(o[k]);f[k]=v!==null&&v>=-1&&v<=1?v:null}let s={stock_id:o.stock_id.trim(),stock_name:o.stock_name.trim(),sector:o.sector||'未分類',market:o.market||'未分類',close:num(o.close),change_pct:num(o.change_pct),avg_trade_value_twd:num(o.avg_trade_value_twd),asof:o.asof||'未標示',large_holder_pct:num(o.large_holder_pct),large_holder_change_pp:num(o.large_holder_change_pp),foreign_5d_net_twd:num(o.foreign_5d_net_twd),f};stocks.push(s)}if(!stocks.length)throw Error('找不到股票代號和名稱欄位；請依範例CSV格式匯入');stocks=[...new Map(stocks.map(s=>[s.stock_id,s])).values()];state.stocks=stocks;state.mode='import';state.prices={};state.chipSignals={};state.chipMeta=null;state.chipFilter='all';state.current=stocks[0].stock_id;state.sector='全部產業';state.market='全部市場';state.search='';state.minValue=0;state.page='screener';render();notif(`已載入 ${stocks.length} 檔股票${bad?'，略過 '+bad+' 筆缺少代號／名稱':''}。請核對CSV來源與日期。`)}catch(e){notif('匯入失敗：'+e.message)}}
async function readPrices(file){try{let rows=csvObjects(await fileText(file));if(rows.length>100000)throw Error('價格資料超過10萬列，請拆分檔案');let map={};for(let r of rows){let d=r.date,id=r.stock_id,c=num(r.close);if(!d||!id||c===null||c<=0)continue;(map[id]??=[]).push({date:d,close:c,volume_shares:num(r.volume_shares)})}let keys=Object.keys(map);if(!keys.length)throw Error('找不到 date、stock_id、close 欄位');if(state.mode==='demo'){state.stocks=[];state.prices={};}for(let id of keys){let list=map[id].sort((a,b)=>a.date.localeCompare(b.date));state.prices[id]=list;let stock=state.stocks.find(x=>x.stock_id===id);if(stock){stock.close=list.at(-1).close;stock.asof=list.at(-1).date}else{state.stocks.push({stock_id:id,stock_name:'未提供名稱',sector:'未分類',market:'未分類',close:list.at(-1).close,change_pct:null,avg_trade_value_twd:null,asof:list.at(-1).date,large_holder_pct:null,large_holder_change_pp:null,foreign_5d_net_twd:null,f:{}})}}state.mode='import';state.chipSignals={};state.chipMeta=null;state.chipFilter='all';state.current=keys[0];state.page='stock';render();notif(`已載入 ${keys.length} 檔股票的價格資料；價格資料不會自動生成其他11項因子。`)}catch(e){notif('價格匯入失敗：'+e.message)}}
async function loadOfficial(silent=false){
  if(location.protocol==='file:'){
    if(!silent)notif('請先將網站部署到有網址的網頁空間；本機HTML仍可使用示範及CSV匯入。');
    return;
  }
  try{
    const v='?t='+Date.now();
    const mr=await fetch('./data/official_meta.json'+v,{cache:'no-store'});
    if(!mr.ok)throw Error('找不到官方資料狀態檔');
    const meta=await mr.json();
    if(!['ok','partial','stale'].includes(meta.status))throw Error('官方資料目前無法取得');
    const cr=await fetch('./data/official_snapshot.csv'+v,{cache:'no-store'});
    if(!cr.ok)throw Error('找不到官方收盤行情檔');
    const objs=csvObjects(await cr.text());
    const stocks=[];
    for(const o of objs){
      if(!o.stock_id||!o.stock_name)continue;
      const close=num(o.close),dayValue=num(o.trade_value_twd);
      if(close===null||close<=0)continue;
      const f={};for(const k of Object.keys(FACTOR_NAME))f[k]=null;
      stocks.push({stock_id:o.stock_id,stock_name:o.stock_name,sector:o.sector||'未分類',market:o.market||'未分類',close,
        change_pct:num(o.change_pct),trade_value_twd:dayValue,avg_trade_value_twd:null,asof:o.asof||'未標示',
        large_holder_pct:null,large_holder_change_pp:null,foreign_5d_net_twd:null,f});
    }
    if(!stocks.length)throw Error('官方收盤檔缺少有效股票');
    state.stocks=stocks;state.prices={};state.mode='official';state.sourceInfo=meta;state.coverage=null;state.chipSignals={};state.chipMeta=null;state.chipFilter='all';state.rankRows=[];state.rankMeta=null;state.rankSearch='';state.historyNote='正在取得歷史行情';ensureResearchStocks();
    state.search='';state.market='全部市場';state.sector='全部產業';state.sort='turnover';
    state.minValue=0;state.current=state.stocks.some(s=>s.stock_id===state.current)?state.current:'8064';
    state.page='screener';render();
    await loadOfficialHistory(true);
    await loadChipData(true);
    await loadRankData(true);
    if(!silent)notif('已載入 '+stocks.length+' 檔官方收盤行情。12因子及預測尚待串接。');
  }catch(e){
    if(!silent)notif('官方資料暫不可用：'+e.message+'。仍可使用本機示範與CSV匯入。');
  }
}
function qcsv(x){let s=String(x??'');if(/^[=+\-@]/.test(s))s="'"+s;return'"'+s.replaceAll('"','""')+'"'}
function exportCSV(){let cols=['stock_id','stock_name','sector','market','asof','close','avg_trade_value_twd','large_holder_pct','large_holder_change_pp','factor_coverage','score',...Object.keys(FACTOR_NAME)];let rows=rowsFiltered();let lines=[cols.join(','),...rows.map(s=>cols.map(k=>qcsv(k==='factor_coverage'?s.calc.count:k==='score'?s.calc.total:(k in FACTOR_NAME)?s.f[k]:s[k])).join(','))];let blob=new Blob(['\uFEFF'+lines.join('\r\n')],{type:'text/csv;charset=utf-8;'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='TPE_MFDS_篩選結果_'+(state.mode==='demo'?'DEMO':(state.mode==='official'?'官方收盤資料':'匯入資料'))+'.csv';document.body.append(a);a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1200);a.remove();notif('篩選結果已匯出為CSV；分數不是預測勝率。')}
$('nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)nav(b.dataset.page)});$('sideHelp').addEventListener('click',()=>nav('settings'));$('demoReset').addEventListener('click',setDemo);$('officialTop').addEventListener('click',()=>loadOfficial(false));$('importTop').addEventListener('click',()=>{$('snapshotFile').click()});$('snapshotFile').addEventListener('change',async e=>{if(e.target.files[0])await readSnapshot(e.target.files[0]);e.target.value=''});$('pricesFile').addEventListener('change',async e=>{if(e.target.files[0])await readPrices(e.target.files[0]);e.target.value=''});setDemo();if(location.protocol==='https:'||location.protocol==='http:')loadOfficial(true);
