<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TPE-MFDS 2.9J｜雙引擎候選研究</title><style>
body{margin:0;background:#f3f6fa;color:#18344a;font:14px/1.6 system-ui,"Microsoft JhengHei",sans-serif}main{max-width:1300px;margin:auto;padding:25px}h1{font-size:25px}.muted{color:#667b8d}a{color:#176b9a}.panel{background:white;border:1px solid #dce6ed;border-radius:12px;padding:18px;margin:14px 0}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input,select,button{font:inherit;padding:10px;border:1px solid #c5d5df;border-radius:7px}button{background:#215779;color:white;cursor:pointer}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1100px}td,th{padding:10px 8px;border-bottom:1px solid #e7edf1;text-align:left}th{color:#607688;font-size:12px}.warn{background:#fff5e7;border:1px solid #ebd4ad;padding:12px;border-radius:8px}.pass{color:#14765e}.unknown{color:#916320}.metrics{display:flex;gap:12px;flex-wrap:wrap}.metrics div{flex:1;min-width:170px;border:1px solid #e1e9ef;border-radius:9px;padding:12px}.metrics b{display:block;font-size:23px}.detail{background:#f4f8fb;padding:13px;border-radius:8px;margin-top:10px}tr{cursor:pointer}tr:hover{background:#f6f9fb}</style></head><body><main>
<p><a href="./index.html">← 研究中心</a>　<a href="./stock_research_29i.html">個股完整研究</a>　<a href="./factor_gaps_29h.html">12因子缺口</a></p><h1>2.9J｜雙引擎全市場候選研究</h1><p class="warn"><b>研究條件清單，不是模型分數／勝率。</b> A引擎檢視趨勢與動能；B引擎檢視大戶、估值與基本面資料。只對相同價格基準日的來源計入條件，缺值不算失敗，也不冒充已驗證因子。每檔股票按「已符合條件數」排序，數量不代表投資優先級或預期報酬。</p>
<div class="panel toolbar"><label>研究引擎 <select id="engine"><option value="A">A｜趨勢動能</option><option value="B">B｜籌碼與價值</option></select></label><label>市場 <select id="market"><option value="all">上市＋上櫃</option><option>上市</option><option>上櫃</option></select></label><label>股票搜尋 <input id="q" placeholder="代號／名稱"></label><label><input type="checkbox" id="basic" checked> 限初步資料合格</label><label><input type="checkbox" id="complete"> 僅顯示本引擎條件全部可判定</label></div>
<div class="panel metrics"><div><small>全市場基本資料列</small><b id="all">—</b></div><div><small>符合目前篩選</small><b id="visible">—</b></div><div><small>本引擎條件數</small><b id="count">—</b></div><div><small>正式模型合格</small><b id="eligible">—</b></div></div>
<div class="panel"><h2 id="title">候選條件</h2><p id="rules" class="muted"></p><p id="status" class="muted">正在讀取歷史封存資料…</p><div class="scroll"><table><thead><tr><th>股票</th><th>價格日</th><th>已符合</th><th>未符合</th><th>無法判定</th><th>資料說明</th></tr></thead><tbody id="rows"></tbody></table></div><p class="muted">僅顯示前200檔，請用搜尋縮小範圍。按一下股票列查看逐項依據。</p><div id="details"></div></div></main>
<script>
'use strict';
const $=x=>document.getElementById(x),E=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
const N=x=>x===undefined||x===null||x===''?null:(Number.isFinite(Number(x))?Number(x):null);
function parseCSV(t){let rows=[],r=[],v='',q=false;t=t.replace(/^\uFEFF/,'');for(let i=0;i<t.length;i++){const c=t[i];if(c==='"'){if(q&&t[i+1]==='"'){v+='"';i++}else q=!q}else if(c===','&&!q){r.push(v);v=''}else if((c==='\r'||c==='\n')&&!q){if(c==='\r'&&t[i+1]==='\n')i++;r.push(v);if(r.some(z=>z!==''))rows.push(r);r=[];v=''}else v+=c}if(v!==''||r.length){r.push(v);rows.push(r)}const h=rows.shift()||[];return rows.map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]??''])))}
const filenames={factor:'factor_evidence_29a.csv',tech:'tech_crosscheck.csv',chip:'chip_signals.csv',sector:'industry_relative_28c.csv',revenue:'revenue_snapshot_28c.csv',valuation:'f2_valuation_29e.csv',risk:'risk_observations_28d.csv'};
const D={},errors={};function get(key,id){return D[key]?.get(id)||{}};function check(label,has,yes,detail){return {label,status:!has?'缺資料':yes?'符合':'未符合',detail:detail||''}}
function evaluate(base,engine){const id=base.stock_id,date=base.price_asof,tech=get('tech',id),chip=get('chip',id),sector=get('sector',id),rev=get('revenue',id),v=get('valuation',id),risk=get('risk',id);
const same=(row,col)=>row[col]===date&&!!date;
const a=[
check('收盤高於MA20',same(tech,'price_asof')&&tech.data_status==='可驗證'&&['是','否'].includes(tech.close_above_ma20),tech.close_above_ma20==='是','技術資料日 '+(tech.price_asof||'缺漏')),
check('MA20趨勢上升',same(tech,'price_asof')&&['是','否'].includes(tech.ma20_rising),tech.ma20_rising==='是','MA20資料日 '+(tech.price_asof||'缺漏')),
check('MACD柱改善',same(tech,'price_asof')&&['是','否'].includes(tech.macd_hist_improving),tech.macd_hist_improving==='是','未調整除權息'),
check('產業20日強於同市場',same(sector,'asof')&&N(sector.industry_relative20_raw_pp)!==null,N(sector.industry_relative20_raw_pp)>0,'產業樣本 '+(sector.industry_peers_20||'缺漏')),
check('外資5日買超',same(chip,'flow_asof')&&N(chip.foreign_5d_shares)!==null,N(chip.foreign_5d_shares)>0,'法人來源日 '+(chip.flow_asof||'缺漏')),
check('投信5日買超',same(chip,'flow_asof')&&N(chip.trust_5d_shares)!==null,N(chip.trust_5d_shares)>0,'法人來源日 '+(chip.flow_asof||'缺漏'))];
const b=[
check('400張以上大戶4週增加',same(chip,'holder_asof')&&N(chip.large400_4w_pp)!==null,N(chip.large400_4w_pp)>0,'持股級距資料日 '+(chip.holder_asof||'缺漏')),
check('1000張以上大戶4週增加',same(chip,'holder_asof')&&N(chip.large1000_4w_pp)!==null,N(chip.large1000_4w_pp)>0,'持股級距資料日 '+(chip.holder_asof||'缺漏')),
check('外資5日買超',same(chip,'flow_asof')&&N(chip.foreign_5d_shares)!==null,N(chip.foreign_5d_shares)>0,'法人來源日 '+(chip.flow_asof||'缺漏')),
check('同業本益比低於中位數（原值）',same(v,'asof')&&N(v.pe_ratio)!==null&&N(v.pe_peer_median)!==null&&N(v.pe_ratio)>0&&N(v.pe_peer_median)>0,N(v.pe_ratio)<N(v.pe_peer_median),'估值不含盈餘預期差；未驗證公告時點'),
check('同業股價淨值比低於中位數（原值）',same(v,'asof')&&N(v.pb_ratio)!==null&&N(v.pb_peer_median)!==null&&N(v.pb_ratio)>0&&N(v.pb_peer_median)>0,N(v.pb_ratio)<N(v.pb_peer_median),'不是便宜或投資價值認證'),
check('單月營收年增為正（表格觀察）',!!rev.table_date&&rev.table_date<=date&&N(rev.month_revenue_yoy_pct)!==null,N(rev.month_revenue_yoy_pct)>0,'資料月份 '+(rev.revenue_period||'缺漏')+'；正式公告時間未驗證')];
const tests=engine==='A'?a:b;const yes=tests.filter(x=>x.status==='符合').length,no=tests.filter(x=>x.status==='未符合').length,unknown=tests.length-yes-no;return {base,tests,yes,no,unknown}}
function render(){const engine=$('engine').value,market=$('market').value,q=$('q').value.trim().toLowerCase();$('count').textContent='6';$('title').textContent=engine==='A'?'A｜趨勢與動能原始條件':'B｜籌碼與價值原始條件';$('rules').textContent=engine==='A'?'技術確認、產業20日相對強度、法人5日買盤':'400／1000張持股級距、外資買盤、同業原始估值、單月營收；非正式基本面評級';
let data=[...D.factor.values()].filter(x=>(market==='all'||x.market===market)&&(!$('basic').checked||x.basic_data_eligible==='true')&&(!q||(x.stock_id+' '+x.stock_name).toLowerCase().includes(q))).map(x=>evaluate(x,engine)).filter(x=>!$('complete').checked||x.unknown===0).sort((a,b)=>b.yes-a.yes||a.unknown-b.unknown||a.base.stock_id.localeCompare(b.base.stock_id));$('visible').textContent=data.length.toLocaleString();$('rows').innerHTML=data.slice(0,200).map((x,i)=>'<tr data-i="'+i+'"><td><b>'+E(x.base.stock_id)+'</b> '+E(x.base.stock_name)+'</td><td>'+E(x.base.price_asof)+'</td><td class="pass">'+x.yes+'/6</td><td>'+x.no+'/6</td><td class="unknown">'+x.unknown+'/6</td><td>'+E(x.base.basic_data_status)+'</td></tr>').join('');$('details').innerHTML='';for(const row of $('rows').querySelectorAll('tr')){row.addEventListener('click',()=>{let x=data[Number(row.dataset.i)];$('details').innerHTML='<div class="detail"><h3>'+E(x.base.stock_id)+' '+E(x.base.stock_name)+'</h3>'+x.tests.map(t=>'<p><b>'+E(t.label)+'</b>：'+E(t.status)+'；'+E(t.detail)+'</p>').join('')+'<a href="./stock_research_29i.html">查看個股深入研究</a></div>'})}$('status').textContent=Object.keys(errors).length?'部分來源讀取失敗：'+Object.keys(errors).join('、')+'；相應條件視為缺資料。':'資料載入完成；未驗證來源仍不能當作正式因子。'}
for(const name of ['engine','market','q','basic','complete'])$(name).addEventListener(name==='q'?'input':'change',()=>{if(D.factor)render()});
(async()=>{await Promise.all(Object.entries(filenames).map(async([name,path])=>{try{let r=await fetch('./data/'+path,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);D[name]=new Map(parseCSV(await r.text()).filter(x=>x.stock_id).map(x=>[x.stock_id,x]))}catch(e){errors[name]=e.message;D[name]=new Map()}}));$('all').textContent=D.factor.size.toLocaleString();$('eligible').textContent=[...D.factor.values()].filter(x=>x.model_eligible==='true').length;render()})().catch(e=>{$('status').textContent='資料載入失敗：'+e.message});
</script></body></html>
