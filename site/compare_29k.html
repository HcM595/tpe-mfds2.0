<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TPE-MFDS 2.9K｜雙引擎品質與個股比較</title><style>body{font:14px/1.65 system-ui,"Microsoft JhengHei",sans-serif;background:#f2f6fa;color:#18374c;margin:0}main{max-width:1200px;margin:auto;padding:24px}.card{background:white;border:1px solid #dce6ed;border-radius:12px;padding:19px;margin:16px 0}h1{font-size:25px}h2{font-size:18px}input,select,button{font:inherit;padding:10px;border:1px solid #bdcfdc;border-radius:8px}button{background:#245d7b;color:white;cursor:pointer}a{color:#176c9a}.muted{color:#60788b}.warn{padding:12px;border:1px solid #ead5ae;background:#fff7ea;border-radius:9px}.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center}.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:790px}td,th{border-bottom:1px solid #e1eaf1;padding:10px;text-align:left;vertical-align:top}th{color:#536d82;background:#f3f7fa}.pass{color:#16765f}.fail{color:#9a5c36}.missing{color:#93681b}.tiny{font-size:12px;color:#60788b}#status{min-height:24px}details{margin:9px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:14px}.panel{padding:14px;background:#f6f9fc;border:1px solid #e2ebf1;border-radius:10px}</style></head><body><main><p><a href="./index.html">← 研究中心</a>　<a href="./dual_engine_29j.html">2.9J全市場篩選</a>　<a href="./stock_research_29i.html">個股深入研究</a></p><h1>2.9K｜雙引擎品質與跨股比較</h1><p class="warn"><b>不是選股勝率或報酬評分。</b> 分開呈現每個引擎的條件符合情形、能否判定、來源日期一致性、大戶與法人方向。缺資料並非負面訊號；未經正式發布時點核實的資料不得當作歷史可用資訊。</p>
<div class="card toolbar"><label>選擇引擎 <select id="engine"><option value="A">A 趨勢動能</option><option value="B">B 籌碼價值</option></select></label><label>股票代號（逗號分隔，最多5檔） <input id="stocks" value="8064,3533,2345,2330" style="min-width:270px"></label><button id="compare">比較</button></div><p id="status" class="muted">正在讀取資料…</p><section class="card"><h2>並排比較</h2><div id="table" class="scroll"></div><p class="tiny">「完整度」只計可判定條件數／6，「符合數」只計通過研究條件數／6，兩者不能互換。日期一致性比對價格、法人與集保報表所屬日期；不代表發布時間已驗證。</p></section><section class="card"><h2>逐檔條件與來源缺口</h2><div id="details" class="grid"></div></section></main><script>
'use strict';const $=x=>document.getElementById(x);const E=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));const n=x=>x===''||x==null?null:(Number.isFinite(Number(x))?Number(x):null);
function csv(t){t=t.replace(/^\uFEFF/,'');let rows=[],r=[],v='',q=false;for(let i=0;i<t.length;i++){let c=t[i];if(c==='"'){if(q&&t[i+1]==='"'){v+='"';i++}else q=!q}else if(c===','&&!q){r.push(v);v=''}else if((c==='\r'||c==='\n')&&!q){if(c==='\r'&&t[i+1]==='\n')i++;r.push(v);if(r.some(x=>x!==''))rows.push(r);r=[];v=''}else v+=c}if(v!==''||r.length){r.push(v);rows.push(r)}const h=rows.shift()||[];return rows.map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]??''])))}
const paths={factor:'factor_evidence_29a.csv',chip:'chip_signals.csv',tech:'tech_crosscheck.csv',industry:'industry_relative_28c.csv',valuation:'f2_valuation_29e.csv',revenue:'revenue_snapshot_28c.csv'};const D={},errors={};function get(k,id){return D[k]?.get(id)||{}}
function verdict(label,valid,ok,explain){return {label,status:!valid?'無法判定':ok?'符合':'未符合',explain}}
function analyze(id,engine){const b=get('factor',id);if(!b.stock_id)return null;const d=b.price_asof,c=get('chip',id),t=get('tech',id),i=get('industry',id),v=get('valuation',id),r=get('revenue',id);const same=(row,k)=>!!d&&row[k]===d;
const checks=engine==='A'?[
verdict('高於MA20',same(t,'price_asof')&&t.data_status==='可驗證'&&['是','否'].includes(t.close_above_ma20),t.close_above_ma20==='是',t.price_asof||'技術日缺漏'),
verdict('MA20上升',same(t,'price_asof')&&['是','否'].includes(t.ma20_rising),t.ma20_rising==='是',t.price_asof||'技術日缺漏'),
verdict('MACD柱改善',same(t,'price_asof')&&['是','否'].includes(t.macd_hist_improving),t.macd_hist_improving==='是','未還原除權息'),
verdict('產業20日強於市場',same(i,'asof')&&n(i.industry_relative20_raw_pp)!==null,n(i.industry_relative20_raw_pp)>0,i.status||'產業資料缺漏'),
verdict('外資5日買超',same(c,'flow_asof')&&n(c.foreign_5d_shares)!==null,n(c.foreign_5d_shares)>0,c.flow_asof||'法人日缺漏'),
verdict('投信5日買超',same(c,'flow_asof')&&n(c.trust_5d_shares)!==null,n(c.trust_5d_shares)>0,c.flow_asof||'法人日缺漏')]:[
verdict('400張以上4週增持',same(c,'holder_asof')&&n(c.large400_4w_pp)!==null,n(c.large400_4w_pp)>0,c.holder_asof||'集保日缺漏'),
verdict('1000張以上4週增持',same(c,'holder_asof')&&n(c.large1000_4w_pp)!==null,n(c.large1000_4w_pp)>0,c.holder_asof||'集保日缺漏'),
verdict('外資5日買超',same(c,'flow_asof')&&n(c.foreign_5d_shares)!==null,n(c.foreign_5d_shares)>0,c.flow_asof||'法人日缺漏'),
verdict('本益比低於同業中位數',same(v,'asof')&&n(v.pe_ratio)>0&&n(v.pe_peer_median)>0,n(v.pe_ratio)<n(v.pe_peer_median),'原始估值；未核實公告時點'),
verdict('股價淨值比低於同業中位數',same(v,'asof')&&n(v.pb_ratio)>0&&n(v.pb_peer_median)>0,n(v.pb_ratio)<n(v.pb_peer_median),'原始估值；非低估認證'),
verdict('月營收年增正值',!!r.table_date&&r.table_date<=d&&n(r.month_revenue_yoy_pct)!==null,n(r.month_revenue_yoy_pct)>0,'彙總表日期；非個別公告時刻')];
const available=checks.filter(x=>x.status!=='無法判定').length,pass=checks.filter(x=>x.status==='符合').length;
const dates=[['價格',d],['法人',c.flow_asof],['集保',c.holder_asof]];const completeDates=dates.every(x=>x[1]);const aligned=completeDates&&dates.every(x=>x[1]===d);
const fh=n(c.foreign_5d_shares),th=n(c.trust_5d_shares),large=n(c.large1000_4w_pp),mid=n(c.large400_4w_pp);
const flowDirection=fh===null||th===null||!same(c,'flow_asof')?'缺資料':fh>0&&th>0?'外資投信同買':fh<0&&th<0?'外資投信同賣':'法人方向分歧／中性';
const holders=large===null||mid===null||!same(c,'holder_asof')?'缺資料':large>0&&mid>0?'雙級距增加':large<0&&mid<0?'雙級距減少':'級距方向分歧／中性';
return {id,b,checks,available,pass,flowDirection,holders,alignment:aligned?'三類報表日相同':completeDates?'報表日不同':'至少一類日期缺漏',dates}}
function render(){const ids=[...new Set($('stocks').value.split(/[,，\s]+/).map(x=>x.trim()).filter(Boolean))].slice(0,5);const rows=ids.map(id=>analyze(id,$('engine').value));$('table').innerHTML='<table><thead><tr><th>股票</th><th>價格基準日</th><th>符合數</th><th>條件可判定</th><th>法人方向</th><th>大戶方向</th><th>日期一致性</th><th>正式模型</th></tr></thead><tbody>'+rows.map((r,k)=>r?'<tr><td><b>'+E(r.id)+'</b> '+E(r.b.stock_name)+'</td><td>'+E(r.b.price_asof)+'</td><td>'+r.pass+'/6</td><td>'+r.available+'/6</td><td>'+E(r.flowDirection)+'</td><td>'+E(r.holders)+'</td><td>'+E(r.alignment)+'</td><td>停用</td></tr>':'<tr><td>'+E(ids[k])+'</td><td colspan="7">找不到逐股12因子研究資料</td></tr>').join('')+'</tbody></table>';
$('details').innerHTML=rows.filter(Boolean).map(r=>'<div class="panel"><h3>'+E(r.id)+' '+E(r.b.stock_name)+'</h3><p>符合 '+r.pass+'/6；可判定 '+r.available+'/6</p>'+r.checks.map(c=>'<p><b>'+E(c.label)+'</b>：'+E(c.status)+'<br><small>'+E(c.explain)+'</small></p>').join('')+'<p class="tiny">價格／法人／集保：'+r.dates.map(x=>E(x[0]+' '+(x[1]||'缺漏'))).join('；')+'</p></div>').join('')||'<p>沒有找到可比較的資料。</p>';
$('status').textContent='已載入 '+D.factor.size+' 檔研究資料。'+(Object.keys(errors).length?'來源缺漏：'+Object.keys(errors).join('、'):'所有所需資料檔均可讀取。')}
$('compare').onclick=()=>D.factor&&render();$('engine').onchange=()=>D.factor&&render();
(async()=>{await Promise.all(Object.entries(paths).map(async([key,path])=>{try{const r=await fetch('./data/'+path,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);D[key]=new Map(csv(await r.text()).filter(x=>x.stock_id).map(x=>[x.stock_id,x]))}catch(e){D[key]=new Map();errors[key]=e.message}}));if(!D.factor.size)throw Error('缺少逐股因子主資料，無法比較');render()})().catch(e=>$('status').textContent='無法載入：'+e.message);
</script></body></html>
