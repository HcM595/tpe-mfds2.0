:root{font-family:system-ui,"Microsoft JhengHei",sans-serif;color:#20384b;background:#f3f6fa}body{margin:0}main{max-width:1200px;margin:auto;padding:25px}h1{font-size:26px}h2{font-size:18px;margin:0 0 14px}.muted,small{color:#687d8d}a{color:#146c9d}.card{background:white;border:1px solid #dce6ec;border-radius:13px;padding:19px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.metric{border:1px solid #e1eaf0;border-radius:9px;padding:13px}.metric b{display:block;font-size:21px;overflow-wrap:anywhere}input,button{font:inherit;border-radius:8px;padding:10px 12px}input{border:1px solid #b5c7d1}button{border:0;background:#205877;color:white;cursor:pointer}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:580px}td,th{padding:10px 8px;text-align:left;border-bottom:1px solid #e3ebef;vertical-align:top}th{font-size:12px;color:#607989}.warning{background:#fff7e8;border:1px solid #ead7b2;border-radius:9px;padding:13px}.fail{color:#a13d38}#out[hidden]{display:none}@media(max-width:800px){.grid,.metrics{grid-template-columns:1fr 1fr}}@media(max-width:480px){.grid,.metrics{grid-template-columns:1fr}} </style></head><body><main>
<p><a href="./index.html">← 返回研究中心</a>　|　<a href="./factor_gaps_29h.html">查看12因子驗證缺口</a></p><h1>2.9I｜個股完整研究</h1><p class="muted">整合官方行情、法人／集保持股級距、技術交叉檢查、產業相對強度與未還原價格風險。所有欄位依來源日期標示，不提供勝率或進出場指令。</p>

<section class="card" aria-label="2.9O公布時點稽核"><h2>2.9O｜歷史資料可得性與阻擋原因</h2><p class="muted">截止點：價格基準日臺灣時間00:00。資料所屬日、首次取得及官方公布時間須分別確認；通過時鐘檢查也不是模型或回測資格。</p><div class="scroll" id="release-audit"></div></section></div>
<p class="muted">所有數值僅為歷史觀察。20／60日高低為歷史收盤價區間，並非已驗證支撐壓力；未做除權息還原，不能直接推導停損、報酬或ATR。</p>

'use strict';
const $=id=>document.getElementById(id);
const E=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
const val=v=>v===undefined||v===null||v===''?'—':E(v);
const num=(v,d=2)=>{if(v===null||v===undefined||v==='')return '—';const n=Number(v);return Number.isFinite(n)?n.toLocaleString('zh-TW',{maximumFractionDigits:d}):'—'};
function parseCSV(text){text=text.replace(/^\uFEFF/,'');let list=[],row=[],v='',quote=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(quote&&text[i+1]==='"'){v+='"';i++}else quote=!quote}else if(c===','&&!quote){row.push(v);v=''}else if((c==='\r'||c==='\n')&&!quote){if(c==='\r'&&text[i+1]==='\n')i++;row.push(v);if(row.some(x=>x!==''))list.push(row);row=[];v=''}else v+=c}if(v!==''||row.length){row.push(v);list.push(row)}const header=list.shift()||[];return list.map(r=>Object.fromEntries(header.map((k,i)=>[k,r[i]??''])))}
const resources={official:'official_snapshot.csv',chips:'chip_signals.csv',rank:'chip_rank.csv',tech:'tech_crosscheck.csv',industry:'industry_relative_28c.csv',risk:'risk_observations_28d.csv',factor:'factor_evidence_29a.csv',publication:'publication_gate_29o.csv'};
const data={};const issues={};let all=[];
const clockReasons={invalid_price_day:'價格日不合法',missing_report_day:'來源報表日缺漏',report_after_price_day:'報表日晚於股價日',first_seen_unverified:'首次取得時間未驗證',first_seen_after_cutoff:'首次取得時間晚於研究截止點',official_publication_unverified:'正式公布時刻未驗證',publication_after_cutoff:'正式公布晚於截止點',capture_precedes_official_release:'聲稱的公布時間晚於首次取得，資料時間矛盾',source_authorization_missing:'來源歷史使用資格未開啟'};
const reasonLabels=raw=>!raw?'尚無阻擋項目':raw.split(';').map(x=>clockReasons[x]||x).join('；');
const details=items=>'<table><tbody>'+items.map(([a,b])=>'<tr><th>'+E(a)+'</th><td>'+val(b)+'</td></tr>').join('')+'</tbody></table>';
const present=(source,id)=>data[source]?.get(id)||{};
function show(id){
 const p=present('official',id),c=present('chips',id),r=present('rank',id),t=present('tech',id),i=present('industry',id),k=present('risk',id),f=present('factor',id);
 if(!Object.keys(p).length&&!Object.keys(f).length){$('status').textContent='查無此股票，請確認代號';$('out').hidden=true;return}
 const name=p.stock_name||f.stock_name||r.stock_name||'名稱待查';$('status').textContent='已載入 '+id+' '+name;$('out').hidden=false;
 $('heading').textContent=id+' '+name+'｜'+(p.market||f.market||'市場未核對');
 const dates=[['收盤',p.asof],['法人',c.flow_asof],['集保',c.holder_asof],['技術',t.price_asof],['產業',i.asof],['風險',k.price_asof]];
 const observed=dates.filter(x=>x[1]);const aligned=observed.every(x=>x[1]===observed[0]?.[1]);
 $('caveat').textContent='資料日期：'+dates.map(x=>x[0]+' '+(x[1]||'缺漏')).join('｜')+'。'+(aligned?'可見來源日期相同，但不表示已核實發布時間。':'部分來源日期不同，禁止視為同日同步訊號。')+' 模型分數與預測機率停用。';
 $('headline').innerHTML=[['收盤',num(p.close)],['漲跌幅',p.change_pct?num(p.change_pct)+'%':'—'],['成交額（元）',num(p.trade_value_twd,0)],['資料日',val(p.asof)]].map(x=>'<div class="metric"><small>'+x[0]+'</small><b>'+x[1]+'</b></div>').join('');
 $('chip').innerHTML=details([['法人資料日',c.flow_asof],['集保週資料日',c.holder_asof],['外資5日買賣超（股）',num(c.foreign_5d_shares,0)],['投信5日買賣超（股）',num(c.trust_5d_shares,0)],['400張以上持股比例',c.large400_pct?num(c.large400_pct)+'%':'—'],['400張以上4週變動',c.large400_4w_pp?num(c.large400_4w_pp)+'百分點':'—'],['1000張以上持股比例',c.large1000_pct?num(c.large1000_pct)+'%':'—'],['1000張以上4週變動',c.large1000_4w_pp?num(c.large1000_4w_pp)+'百分點':'—'],['同步增持條件',c.chip_status],['籌碼條件說明',c.chip_reason],['描述性籌碼排名',r.rank_status==='可排名'?r.chip_strength_rank:'不適用']]);
 $('technical').innerHTML=details([['技術資料狀態',t.data_status],['MA20',num(t.ma20)],['MA60',num(t.ma60)],['高於MA20',t.close_above_ma20],['MA20上升',t.ma20_rising],['RSI14',num(t.rsi14)],['MACD柱',num(t.macd_hist,4)],['MACD柱改善',t.macd_hist_improving],['技術確認數',t.technical_confirmed_count? t.technical_confirmed_count+'/3':'—'],['持股結構分歧',t.holder_structure]]);
 $('industry').innerHTML=details([['產業',i.industry_name_from_revenue],['資料日',i.asof],['同業樣本20日',i.industry_peers_20],['相對市場20日（百分點）',num(i.industry_relative20_raw_pp)],['同業樣本60日',i.industry_peers_60],['相對市場60日（百分點）',num(i.industry_relative60_raw_pp)],['狀態',i.status],['調整除權息',i.price_adjusted]]);
 $('risk').innerHTML=details([['資料日',k.price_asof],['過去20日收盤高點',num(k.prior20_close_high)],['過去20日收盤低點',num(k.prior20_close_low)],['過去60日收盤高點',num(k.prior60_close_high)],['過去60日收盤低點',num(k.prior60_close_low)],['20日最大收盤回落',k.max_close_drawdown20_pct?num(k.max_close_drawdown20_pct)+'%':'—'],['20日年化歷史波動',k.realized_volatility20_annualized_pct?num(k.realized_volatility20_annualized_pct)+'%':'—'],['ATR可用',k.atr_available==='true'?'是':'否'],['價格已還原',k.price_adjusted==='true'?'是':'否']]);
 window.MFDSPitClock.render(id,$('pit-clock'));
 const audit=present('publication',id);
 $('release-audit').innerHTML=!audit.stock_id?'<p>目前沒有此股票的2.9O來源稽核檔；不能宣稱歷史可得。</p>':
 details([['資料對照價格日',audit.price_asof],
 ['F2 估值時鐘檢查',audit.F2_asof_clock_pass==='true'?'僅時鐘檢查通過（非模型資格）':'未通過'],
 ['F2 首次取得（UTC）',audit.F2_first_seen_utc],
 ['F2 官方公布（UTC）',audit.F2_verified_publication_utc||'未驗證'],
 ['F2 阻擋原因',reasonLabels(audit.F2_blockers)],
 ['F3 治理時鐘檢查',audit.F3_asof_clock_pass==='true'?'僅時鐘檢查通過（非模型資格）':'未通過'],
 ['F3 官方公布（UTC）',audit.F3_verified_publication_utc||'未驗證'],
 ['F3 阻擋原因',reasonLabels(audit.F3_blockers)],
 ['月營收來源出表日',audit.REVENUE_source_report_day],
 ['月營收首次取得（UTC）',audit.REVENUE_first_seen_utc],
 ['月營收逐公司正式公布（UTC）',audit.REVENUE_verified_publication_utc||'未驗證'],
 ['月營收時鐘檢查',audit.REVENUE_asof_clock_pass==='true'?'僅時鐘檢查通過（非模型資格）':'未通過'],
 ['月營收阻擋原因',reasonLabels(audit.REVENUE_blockers)]]);
 $('release-audit').insertAdjacentHTML('beforeend','<p><a href="./publication_review_29p.html?stock='+encodeURIComponent(id)+'">查看本股待核查官方公布證據</a></p>');
 $('release-audit').insertAdjacentHTML('beforeend','<p><a href="./event_crosscheck_29r.html?stock='+encodeURIComponent(id)+'">比對本股重大訊息與財務來源版本（2.9R）</a></p>');
 $('release-audit').insertAdjacentHTML('beforeend','<p><a href="./event_body_audit_29s.html?stock='+encodeURIComponent(id)+'">核對本股重大訊息正文與原始來源版本（2.9S）</a></p>');
 $('factor').innerHTML=details([['歷史和流動性初篩',f.basic_data_status],['有原始觀察因子',f.observed_factor_count?f.observed_factor_count+'/12':'—'],['正式驗證因子',f.verified_factor_count?f.verified_factor_count+'/12':'—'],['正式模型資格',f.model_eligible==='true'?'有':'未啟用'],['資料首次封存晚於價格日',f.source_postdates_price==='true'?'是（警示）':'否或未知']])+'<p><a href="./factor_gaps_29h.html">查看各因子待補證據（可在該頁輸入相同代號）</a></p>';
}
function lookup(){const q=$('query').value.trim().toLowerCase();if(!q){$('status').textContent='請輸入股票代號或名稱';return}const match=all.find(x=>x.stock_id.toLowerCase()===q||x.stock_name.toLowerCase()===q)||all.find(x=>x.stock_name.toLowerCase().includes(q)||x.stock_id.includes(q));if(match)show(match.stock_id);else{$('status').textContent='找不到相符股票';$('out').hidden=true}}
$('find').onclick=lookup;$('query').addEventListener('keydown',e=>{if(e.key==='Enter')lookup()});
(async()=>{await Promise.all(Object.entries(resources).map(async([key,file])=>{try{const res=await fetch('./data/'+file,{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);data[key]=new Map(parseCSV(await res.text()).filter(x=>x.stock_id).map(x=>[x.stock_id,x]))}catch(e){issues[key]=e.message;data[key]=new Map()}}));all=[...data.official.values()];if(!all.length)all=[...data.factor.values()];$('status').textContent=all.length+'檔可查詢'+(Object.keys(issues).length?'；部分來源缺漏：'+Object.keys(issues).join('、'):'')+'。';$('query').value='8064';lookup()})().catch(e=>{$('status').textContent='載入失敗：'+e.message});
</script></body></html>
