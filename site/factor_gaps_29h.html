<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TPE-MFDS 2.9H｜逐股12因子驗證缺口</title>
<style>body{font:15px/1.65 system-ui,"Microsoft JhengHei",sans-serif;background:#f3f6fa;color:#1c3348;margin:0}main{max-width:1150px;margin:auto;padding:25px}h1{font-size:25px}a{color:#17618e}.muted{color:#617589}.panel{background:white;border:1px solid #dce6ef;border-radius:13px;padding:19px;margin:16px 0}input{font:inherit;padding:11px;border:1px solid #adc3d1;border-radius:8px;max-width:100%;width:290px}button{font:inherit;padding:10px 15px;border:0;border-radius:8px;background:#1d536f;color:white;cursor:pointer}table{border-collapse:collapse;width:100%;min-width:730px}th,td{padding:9px;border-bottom:1px solid #e4ebf1;text-align:left;vertical-align:top}th{background:#eff4f8}.scroll{overflow:auto}.pill{display:inline-block;border-radius:20px;padding:1px 9px;background:#e8eef3}.warn{color:#905d19}.metric{display:flex;gap:17px;flex-wrap:wrap}.metric b{display:block;font-size:22px}.metric>div{flex:1;min-width:145px}.error{color:#a13e38}small{color:#697b89}</style></head><body><main>
<p><a href="./index.html">← 返回 TPE-MFDS 研究中心</a></p><h1>2.9H｜逐股 12 因子證據與驗證缺口</h1>
<p class="muted">僅呈現官方／已封存來源的原始觀察狀態。不提供未驗證模型分數、預測機率或投資建議。資料日期不等於正式公布時刻。</p>
<div class="panel metric"><div><small>樣本股票</small><b id="total">—</b></div><div><small>初步資料／流動性通過</small><b id="basic">—</b></div><div><small>正式模型合格</small><b id="qualified">—</b></div><div><small>因子驗證完成</small><b id="verified">—</b></div></div>
<div class="panel"><label for="stock">股票代號或名稱</label><p><input id="stock" placeholder="例：8064、3533、台積電" autocomplete="off"> <button id="lookup">查詢</button></p><p id="message" class="muted">正在載入逐股因子證據…</p></div>
<section id="result" class="panel" hidden><h2 id="stocktitle"></h2><div id="summary"></div><div class="scroll"><table><thead><tr><th>因子</th><th>現有證據等級</th><th>資料所屬日期</th><th>尚缺關鍵條件</th></tr></thead><tbody id="rows"></tbody></table></div><p class="muted">驗證門檻：12項因子需獨立核實來源發布時間、計算一致性、證券身分、股價調整與樣本外方法。原始資料存在不等於因子驗證通過。</p></section>
<div class="panel"><h2>各因子的待驗證項目</h2><p class="muted">此清單描述原始模型所需的共同條件；逐股「無資料」另代表該股票在目前來源中沒有對應原始觀察。</p><div id="all-gaps"></div></div>
</main><script>
const SPEC=[
['M1','景氣對策','景氣指標的正式公布時點、修訂版本及當時可得性'],['M2','外需動能','出口、外銷訂單金額變化及各自公告時點'],['M3','匯率與資金','完整市場資金流向、匯率資料時點'],['I1','產業週期','庫存與多期產業循環資料、公告時點'],['I2','政策扶持','逐股政策適用資格及受惠證據'],['I3','產業輪動','還原價格的20／60日相對強度及樣本外驗證'],['F1','盈利品質','對齊期間的現金流、淨利、合併範圍及公告日'],['F2','估值與預期差','預期差資料、同業可比性及官方發布時間'],['F3','公司治理','完整治理資料、逐股公告時間及品質定義'],['S1','法人動向','法人流量來源時點、歷史可得性與計算驗證'],['S2','散戶情緒','當沖、融資與股東級距的正確替代限制及來源日期'],['S3','技術與波動','經公司行動調整的OHLC、ATR與獨立回測']];
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
// RFC4180-style quoted CSV, including embedded newlines and doubled quotes.
function csv(text){let rows=[],row=[],field='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){field+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(field);field=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(x=>x!==''))rows.push(row);row=[];field=''}else field+=c}if(field!==''||row.length){row.push(field);rows.push(row)}const head=rows.shift()||[];return rows.map(r=>Object.fromEntries(head.map((k,i)=>[k,r[i]??''])))}
const names={no_data:'尚無對應原始資料',partial:'部分原始資料',descriptive:'可描述的原始觀察',verified:'已驗證'};
let records=[],meta=null;
function show(record){
 $('result').hidden=false;$('stocktitle').textContent=record.stock_id+' '+record.stock_name+'（'+record.market+'）';
 $('summary').innerHTML='<p>價格基準日：'+esc(record.price_asof||'未知')+'；初步資料資格：'+esc(record.basic_data_status||'未知')+'；觀察到的因子：'+esc(record.observed_factor_count)+'/12；已驗證因子：'+esc(record.verified_factor_count)+'/12</p><p class="warn">模型資格：未開啟；本頁不將部分或描述性證據視為已驗證。</p>';
 $('rows').innerHTML=SPEC.map(([id,name,gap])=>{const state=record[id+'_state']||'no_data';const issue=state==='no_data'?'該股原始證據缺漏；'+gap:gap;return '<tr><td><b>'+id+'</b> '+name+'</td><td>'+esc(names[state]||'未知')+'</td><td>'+esc(record[id+'_asof']||'未提供')+'</td><td>'+esc(issue)+'</td></tr>'}).join('');
}
function lookup(){const q=$('stock').value.trim().toLowerCase();if(!q){$('message').textContent='請輸入股票代號或名稱';return}const exact=records.find(r=>r.stock_id.toLowerCase()===q||r.stock_name.toLowerCase()===q),found=exact||records.find(r=>r.stock_id.includes(q)||r.stock_name.toLowerCase().includes(q));if(!found){$('result').hidden=true;$('message').textContent='沒有找到符合資料的股票，請確認代號或公司名稱';return}$('message').textContent='已找到 '+found.stock_id+' '+found.stock_name;show(found)}
$('lookup').onclick=lookup;$('stock').addEventListener('keydown',e=>{if(e.key==='Enter')lookup()});
$('all-gaps').innerHTML='<div class="scroll"><table><thead><tr><th>因子</th><th>驗證前仍需補齊</th></tr></thead><tbody>'+SPEC.map(x=>'<tr><td>'+x[0]+' '+x[1]+'</td><td>'+x[2]+'</td></tr>').join('')+'</tbody></table></div>';
(async()=>{try{const [cr,mr]=await Promise.all([fetch('./data/factor_evidence_29a.csv',{cache:'no-store'}),fetch('./data/factor_evidence_meta_29a.json',{cache:'no-store'})]);if(!cr.ok||!mr.ok)throw Error('資料檔未發布');records=csv(await cr.text());meta=await mr.json();$('total').textContent=records.length.toLocaleString();$('basic').textContent=records.filter(r=>r.basic_data_eligible==='true').length.toLocaleString();$('qualified').textContent=records.filter(r=>r.model_eligible==='true').length.toLocaleString();$('verified').textContent=(meta.count_verified_factors??'—')+' / 12';$('message').textContent='資料版本 '+(meta.version||'未知')+'；來源建檔時間 '+(meta.generated_at_taipei||'未標示')+'。請輸入股票代號。';if(records.some(r=>r.stock_id==='8064')){$('stock').value='8064';lookup()}}catch(e){$('message').className='error';$('message').textContent='載入失敗：'+e.message+'。請確認發布工作流程及資料路徑。'}})();
</script></body></html>
