name: 3.0N 自選股研究追蹤中心驗收
on:
  pull_request:
    paths:
      - 'site/index.html'
      - 'site/watchlist_center_30n.js'
      - 'site/editorial_30k.css'
      - 'tests/watchlist_center_30n.test.cjs'
      - 'tests/browser_watchlist_30n.cjs'
      - '.github/workflows/publish.yml'
      - '.github/workflows/watchlist-center-30n.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  watchlist-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify saved stock ids and dated original evidence against actual records
        run: |
          node --check site/watchlist_center_30n.js
          node --check tests/watchlist_center_30n.test.cjs
          node --check tests/browser_watchlist_30n.cjs
          node tests/watchlist_center_30n.test.cjs
          node tests/stock_evidence_30m.test.cjs
          node tests/chip_tech_crossfilter_30l.test.cjs
          python -m unittest -v tests/test_original_goal_site_30j.py tests/test_editorial_30k.py
      - name: Install headless Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium
      - name: Browser verify watchlist, retained study flows and responsive design
        run: |
          python -m http.server 8765 --directory site > /tmp/mfds-watch-30n.log 2>&1 &
          sleep 2
          node tests/browser_watchlist_30n.cjs
          node tests/browser_stock_evidence_30m.cjs
          node tests/browser_crossfilter_30l.cjs
          node tests/browser_editorial_30k.cjs
