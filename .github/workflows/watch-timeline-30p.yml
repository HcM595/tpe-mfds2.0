name: 3.0P 自選股研究觀察時間軸驗收
on:
  pull_request:
    paths:
      - 'site/index.html'
      - 'site/watch_timeline_30p.js'
      - 'site/editorial_30k.css'
      - 'tests/watch_timeline_30p.test.cjs'
      - 'tests/browser_watch_timeline_30p.cjs'
      - '.github/workflows/publish.yml'
      - '.github/workflows/watch-timeline-30p.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verified-timeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test actual first captured archives, SHA256 and deceptive weekly-history cases
        run: |
          node --check site/watch_timeline_30p.js
          node --check tests/watch_timeline_30p.test.cjs
          node --check tests/browser_watch_timeline_30p.cjs
          node tests/watch_timeline_30p.test.cjs
          node tests/watch_history_30o.test.cjs
          node tests/watchlist_center_30n.test.cjs
          python -m unittest -v tests/test_editorial_30k.py tests/test_original_goal_site_30j.py
      - name: Install Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium
      - name: Browser test timeline and regression journeys
        run: |
          python -m http.server 8765 --directory site > /tmp/mfds-30p-http.log 2>&1 &
          sleep 2
          node tests/browser_watch_timeline_30p.cjs
          node tests/browser_watch_history_30o.cjs
          node tests/browser_watchlist_30n.cjs
          node tests/browser_stock_evidence_30m.cjs
