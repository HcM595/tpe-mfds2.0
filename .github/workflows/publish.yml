name: 台股收盤行情更新與網頁發布

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      backfill_days:
        description: '本次回補幾個全市場歷史工作日（預設15；最多45）'
        required: false
        default: '15'
      chip_backfill_days:
        description: '本次嘗試回補多少個法人歷史日期（各市場，建議先12）'
        required: false
        default: '12'
  schedule:
    # 臺灣時間18:17；GitHub可能延遲或漏跑
    - cron: '17 10 * * 1-5'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mfds-pages-and-history
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 即使同一個使用者 Commit 觸發多個排隊工作，也從開始執行時的最新 main 取得完整資料。
      # 避免 checkout 固定在舊 github.sha，導致 git push 遭 remote ahead 拒絕。
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 2.9N 三時鐘原始資料解析與網頁JS基礎語法檢查
        run: |
          node --check site/pit_clock_29n.js
          node tests/pit_clock_29n.test.cjs
      - name: 取得官方最新收盤行情
        run: python scripts/fetch_official.py
      - name: 優先補齊東捷、嘉澤等個股與分批回補全市場
        env:
          DAYS_PER_RUN: ${{ inputs.backfill_days || '15' }}
        run: |
          python scripts/backfill_history.py --mode all --per-run "$DAYS_PER_RUN"
      - name: 建立並檢查歷史資料
        run: |
          python scripts/build_history.py
          python -m compileall -q scripts
      - name: 回補三大法人歷史與集保週資料（含明確診斷）
        env:
          CHIP_DAYS: ${{ inputs.chip_backfill_days || '12' }}
        run: python scripts/backfill_chips.py --flow-days "$CHIP_DAYS" --holder-weeks 7
      - name: 更新三大法人與集保籌碼資料（不足時留白）
        run: python scripts/chip_pipeline.py
      - name: 核對上市櫃普通股公司名錄並產出2.3籌碼強度排行
        run: python scripts/stock_rank.py
      - name: 發布官方上市櫃公司名錄供全市場資格查詢
        run: cp history_data/ordinary_stock_master.csv site/data/ordinary_stock_master.csv
      - name: 2.3.3 籌碼與技術面雙軌交叉驗證
        run: python scripts/tech_crosscheck.py
      - name: 2.4A 封存當次籌碼排名與技術訊號（防未來資料洩漏）
        run: python scripts/archive_signals.py
      - name: 2.4B 稽核封存來源與回測時間資格（不產生報酬）
        run: python scripts/audit_point_in_time.py
      - name: 2.4D 下載核對官方交易日曆並標記除權息資料缺口（不產生報酬）
        run: python scripts/prepare_market_calendar.py
      - name: 2.4C 登錄不可覆寫的前瞻觀察組與10／20／60日進度（不產生報酬）
        run: python scripts/track_forward.py
      - name: 2.4E 封存官方除權息滾動公告與逐檔品質缺口（不計算報酬）
        run: python scripts/archive_corporate_actions.py
      - name: 2.4F 稽核同收盤交易日的不同訊號資料版本（不計算報酬）
        run: python scripts/audit_cohort_independence.py
      - name: 2.5A 跨來源資料健康、除權息歷史缺口及臨時休市稽核（不計算報酬）
        run: python scripts/audit_research_readiness.py
      - name: 2.5B 分批封存上市櫃官方歷史除權息計算結果（不宣稱完整、不計算報酬）
        run: python scripts/backfill_corporate_action_history.py --start-date 2026-01-01 --months-per-run 2
      - name: 2.6B 匯出法人每日與集保每週實際歷史趨勢（不計算勝率）
        run: python scripts/export_chip_trends.py
      - name: 2.8B 建立法人流量比及原始收盤波動的描述性觀察（不開啟12因子分數）
        run: python scripts/compute_factor_observations_28b.py
      - name: 2.8C 下載及封存上市櫃官方月營收彙總（非個別公告日期）
        run: python scripts/collect_monthly_revenue_28c.py
      - name: 2.8C 計算相同市場產業20與60日相對強度（原始價量，非模型分數）
        run: python scripts/compute_industry_relative_28c.py
      - name: 2.8D 計算歷史收盤風險參考與財務來源缺口（不計算ATR或勝率）
        run: python scripts/compute_risk_observations_28d.py
      - name: 2.8F 封存一般業官方綜合損益表與F1現金流資料缺口（不得產生盈利品質分數）
        run: python scripts/collect_income_28f.py
      - name: 2.8G 封存官方MOPS重點個股累計營業活動現金流（不計算F1比率）
        run: python scripts/collect_cashflow_focus_28g.py
      - name: 2.8I 核對MOPS單季與年初累計淨利原值並和現金流日期單位對齊（F1仍停用）
        run: python -m scripts.collect_mops_income_ytd_28i
      - name: 2.9B 封存國發會景氣與外需及中央銀行匯率原始觀察（不計分、不推論公布時點）
        run: python scripts/collect_macro_29b.py
      - name: 2.9C 封存有日期的官方逐股融資融券餘額（非散戶情緒分數）
        run: python scripts/collect_s2_credit_29c.py
      - name: 2.9D 保存同市場同業月營收擴散率與持續增加的月度歷史（非產業景氣轉折預測）
        run: python scripts/build_industry_cycle_29d.py
      - name: 2.9D 核對經濟部產業政策公告並封存證據（I2個股受惠仍未驗證）
        run: python scripts/collect_policy_evidence_29d.py
      - name: 2.9E 封存官方估值F2與董事長是否兼任總經理F3（不推導預期差或治理分數）
        run: python scripts/collect_f2f3_29e.py
      - name: 2.9F 建立F2/F3來源版本首次取得時間與官方發布時刻缺口稽核（嚴禁歷史倒填）
        run: python scripts/audit_f2f3_pit_29f.py
      - name: 2.9A 發布原始四層12因子逐股資料證據（雙引擎共用，嚴禁未驗證分數）
        run: python scripts/build_factor_evidence_29a.py
      - name: 2.9O 輸出歷史首次取得、正式公布時間與逐股不可回測原因
        run: |
          python -m unittest tests/test_publication_gate_29o.py
          python scripts/audit_publication_gate_29o.py
          node --check site/asof_gate_29o.js
          node tests/asof_gate_29o.test.cjs
      - name: 2.9P 整理逐公司官方公布證據待核查清單（不推定公告時刻）
        run: |
          python -m unittest tests/test_publication_review_29p.py
          python scripts/build_publication_review_29p.py
      - name: 2.9Q 封存上市與上櫃每日重大訊息發言時間（與財務因子首次公告分離）
        run: |
          python -m unittest tests/test_material_events_29q.py
          python scripts/collect_material_events_29q.py
      - name: 2.9R 對照重大訊息主旨與逐股財務來源（不得認證首次發布）
        run: |
          python -m unittest tests/test_publication_event_links_29r.py
          python scripts/reconcile_publication_events_29r.py
      - name: 2.9S 核對原始重大訊息正文、報表期間與來源版本時鐘（不開放模型）
        run: |
          python -m unittest tests/test_event_bodies_29s.py
          python -m scripts.audit_event_bodies_29s
      - name: 3.0A 驗證全市場工作台來源與原始資訊不推導勝率
        run: |
          node --check site/research_core_30a.js
          node tests/research_core_30a.test.cjs
          python - <<'PY'
          import csv
          with open('site/data/factor_evidence_29a.csv',encoding='utf-8-sig',newline='') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)>=1000
          assert len({r['stock_id'] for r in rows})==len(rows)
          assert all(r['model_eligible']=='false' and r['prediction_enabled']=='false' for r in rows)
          print('3.0A research source sanity check:',len(rows),'stocks; forecasting disabled')
          PY
      - name: 3.0B 核實統一研究工作台來源日期與CSV匯出限制
        run: |
          node --check site/research_quality_30b.js
          node tests/research_quality_30b.test.cjs
      - name: 3.0C 驗證跨來源股票身分與觀察日期一致性
        run: |
          node --check site/research_integrity_30c.js
          node tests/research_integrity_30c.test.cjs
      - name: 3.0E 核對官方除權息歷史事件與未還原前收（不得算報酬）
        run: |
          python -m unittest tests/test_corporate_action_readiness_30e.py
          python scripts/audit_corporate_action_readiness_30e.py
          python - <<'PY'
          import csv,json
          rows=list(csv.DictReader(open('site/data/corporate_action_readiness_30e.csv',encoding='utf-8')))
          m=json.load(open('site/data/corporate_action_readiness_meta_30e.json',encoding='utf-8'))
          assert len(rows)==m['stocks']>=1000
          assert all(x['adjusted_ohlc_verified']=='false' and x['total_return_calculation_allowed']=='false' for x in rows)
          assert not m['historical_completeness_verified'] and not m['probability_enabled']
          print('3.0E corporate action consistency',m['stocks'],'stocks, official observed event stocks',m['stocks_with_observed_official_historical_events'])
          PY
      - name: 3.0E 產製本站九類資料SHA256快照並驗證資料版本
        run: |
          python -m unittest tests/test_research_snapshot_30d.py
          python scripts/build_research_snapshot_30d.py
          python scripts/build_research_snapshot_30d.py --verify-only
          node --check site/research_snapshot_30d.js
          node tests/research_snapshot_30d.test.cjs
      - name: 3.0F 勝率研究資格稽核與分期樣本外實驗測試（不發布勝率）
        run: |
          python -m unittest tests/test_prediction_readiness_30f.py tests/test_walk_forward_probability_lab_30f.py
          python scripts/prediction_readiness_30f.py
          python scripts/prediction_readiness_30f.py --verify-only
      - name: 3.0G 核對10／20／60日前瞻成熟度及成交成本試算的假資料反例
        run: |
          python -m unittest tests/test_trade_outcomes_30g.py
          python -m scripts.audit_trade_outcomes_30g
          python -m scripts.audit_trade_outcomes_30g --verify-only
      - name: 2.9L 驗證四個研究頁面、資料欄位與模型安全門檻
        run: python -m unittest tests/test_research_pages_29l.py
      - name: 保存真實價格與籌碼資料及更新進度
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A history_data/ site/data/
          if ! git diff --cached --quiet; then
            git commit -m "data: backfill verified history [skip ci]"
            # 防止本次工作期間另有上傳／資料提交：只做安全重整，絕不強制推送。
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::main 有其他資料更新且無法自動安全整合；停止推送，請檢查紀錄。"
              exit 1
            fi
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: 發布網頁
        uses: actions/deploy-pages@v4
        id: deployment
