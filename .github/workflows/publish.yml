name: 台股收盤行情更新與網頁發布

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Taipei 18:17 (UTC 10:17), Mon–Fri, best effort.
    - cron: '17 10 * * 1-5'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 取得官方收盤行情（不產生虛構資料）
        run: python scripts/fetch_official.py
      - name: 歸檔每日行情與建立歷史指標資料
        run: python scripts/build_history.py
      - name: 留存每日行情到專案（由 GitHub Token 寫入，不觸發重複執行）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history_data/ site/data/official_snapshot.csv site/data/official_meta.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "data: archive verified market snapshot [skip ci]"
            git push origin HEAD:main || echo "WARN: could not persist history; Pages still publishes this run"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: 發布網頁
        uses: actions/deploy-pages@v4
        id: deployment
