name: TPE-MFDS 2.9F 估值治理三時鐘點時稽核與整站驗收
on:
  pull_request:
    paths:
      - 'site/index.html'
      - 'scripts/audit_f2f3_pit_29f.py'
      - 'tests/test_fundamental_pit_29f.py'
      - 'scripts/collect_f2f3_29e.py'
      - 'tests/test_f2f3_29e.py'
      - 'scripts/probe_f2f3_29e.py'
      - 'scripts/build_industry_cycle_29d.py'
      - 'scripts/collect_policy_evidence_29d.py'
      - 'tests/test_industry_cycle_policy_29d.py'
      - 'scripts/collect_s2_credit_29c.py'
      - 'tests/test_s2_credit_29c.py'
      - 'scripts/probe_sentiment_29c.py'
      - 'scripts/collect_macro_29b.py'
      - 'tests/test_macro_29b.py'
      - 'scripts/probe_macro_sources_29b.py'
      - 'scripts/build_factor_evidence_29a.py'
      - 'tests/test_factor_evidence_29a.py'
      - 'scripts/collect_mops_income_ytd_28i.py'
      - 'tests/test_mops_income_28i.py'
      - 'scripts/probe_mops_income_28i.py'
      - 'scripts/collect_cashflow_focus_28g.py'
      - 'tests/test_cashflow_28g.py'
      - 'scripts/probe_mops_cashflow_28g.py'
      - 'scripts/collect_income_28f.py'
      - 'tests/test_income_28f.py'
      - 'scripts/compute_risk_observations_28d.py'
      - 'tests/test_risk_observations_28d.py'
      - 'scripts/collect_monthly_revenue_28c.py'
      - 'scripts/compute_industry_relative_28c.py'
      - 'tests/test_revenue_industry_28c.py'
      - 'scripts/compute_factor_observations_28b.py'
      - 'tests/test_factor_observations_28b.py'
      - 'site/data/factor_readiness_28a.json'
      - '.github/workflows/publish.yml'
      - 'site/research_eligibility_27a.js'
      - 'tests/research_eligibility_27a.test.js'
      - 'tests/browser_26b.cjs'
      - 'site/chip_trends_26b.js'
      - 'tests/chip_trends_26b.test.js'
      - 'tests/audit_chip_trends_26b.py'
      - 'site/data/chip_trend_meta.json'
      - '.github/workflows/test_chip_trends_26b.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JS syntax checks
        run: |
          node --check site/chip_trends_26b.js
          node --check site/research_eligibility_27a.js
          node --check tests/chip_trends_26b.test.js
      - name: Unit tests for missing sessions and invalid data
        run: |
          node tests/chip_trends_26b.test.js
          node tests/research_eligibility_27a.test.js
      - name: Regenerate 2.6B CSV in checkout
        run: python scripts/export_chip_trends.py
      - name: Actual CSV schema and three-stock acceptance audit
        run: python tests/audit_chip_trends_26b.py
      - name: Unit tests and real descriptive S1 S3 calculation
        run: |
          python -m unittest tests/test_factor_observations_28b.py
          python scripts/compute_factor_observations_28b.py
          python -c "import csv,json; d=json.load(open('site/data/factor_observations_meta_28b.json')); r=list(csv.DictReader(open('site/data/factor_observations_28b.csv'))); assert len(r)==d['stocks'] and len(r)>100 and not d['factor_scores_enabled'] and not d['probability_enabled']"
      - name: Test official revenue archive and actual sector strength
        run: |
          python -m unittest tests/test_revenue_industry_28c.py
          python scripts/compute_industry_relative_28c.py
          python -c "import csv,json; m=json.load(open('site/data/industry_relative_meta_28c.json')); rows=list(csv.DictReader(open('site/data/industry_relative_28c.csv'))); assert len(rows)==m['stocks'] and len(rows)>100 and not m['factor_I3_verified']"
      - name: Test raw-price risk metrics with real archived sessions
        run: |
          python -m unittest tests/test_risk_observations_28d.py
          python scripts/compute_risk_observations_28d.py
          python -c "import csv,json; m=json.load(open('site/data/risk_meta_28d.json')); r=list(csv.DictReader(open('site/data/risk_observations_28d.csv'))); assert len(r)==m['stocks'] and len(r)>100; assert not m['atr_supported'] and not m['factor_scores_enabled'] and not m['probability_enabled']; assert m['ref20_available']>100"
      - name: Test official income extraction and forbid unverified cashflow claims
        run: |
          python -m unittest tests/test_income_28f.py
          python -m py_compile scripts/collect_income_28f.py
      - name: Test official cumulative cashflow period, source and F1 disable rules
        run: |
          python -m unittest tests/test_cashflow_28g.py
          python -m py_compile scripts/collect_cashflow_focus_28g.py
      - name: Verify YTD net income parsing against archived cashflow and F1 disable gates
        run: |
          python -m unittest tests/test_mops_income_28i.py
          python -m py_compile scripts/collect_mops_income_ytd_28i.py
      - name: Test original 4-layer 12-factor evidence matrix against real archived stocks
        run: |
          python -m unittest tests/test_factor_evidence_29a.py
          python scripts/build_factor_evidence_29a.py
          python - <<'PY'
          import csv,json
          with open('site/data/factor_evidence_meta_29a.json',encoding='utf-8') as f:m=json.load(f)
          with open('site/data/factor_evidence_29a.csv',encoding='utf-8') as f:rows=list(csv.DictReader(f))
          assert len(rows)==m['stocks'] and len(rows)>100
          assert m['count_verified_factors']==0 and m['model_eligible_stocks']==0
          assert not m['model_scores_enabled'] and not m['performance_probabilities_enabled']
          assert len(m['per_factor'])==12
          assert all(r['verified_factor_count']=='0' and r['prediction_enabled']=='false' for r in rows)
          print('12-factor full-universe model evidence regression OK:',len(rows))
          PY
      - name: Official NDC business signals and CBC exchange-rate ingestion
        run: |
          python -m unittest tests/test_macro_29b.py
          python -m py_compile scripts/collect_macro_29b.py
          python scripts/collect_macro_29b.py
          python scripts/build_factor_evidence_29a.py
          python - <<'PY'
          import csv,json
          m=json.load(open('site/data/macro_snapshot_29b.json'))
          f=json.load(open('site/data/factor_evidence_meta_29a.json'))
          stocks=list(csv.DictReader(open('site/data/factor_evidence_29a.csv')))
          assert m['records']['ndc']>100 and m['records']['cbc']>100
          assert m['M1']['observation_period'] and m['M3']['exchange_close_date']
          assert m['M1']['published_at'] is None and m['M2']['published_at'] is None
          assert not m['factor_scores_enabled'] and not m['probability_enabled']
          assert not f['model_scores_enabled'] and not f['performance_probabilities_enabled']
          assert f['macro_publication_dates_verified'] is False
          assert len(stocks)==f['stocks'] and f['count_verified_factors']==0
          assert all(row['model_eligible']=='false' for row in stocks)
          print('NDC/CBC original macro source and 12-factor evidence OK',m['records'])
          PY
      - name: 2.9C Inspect official margin and intraday trading schemas
        run: python scripts/probe_sentiment_29c.py
      - name: Test source dated credit-trading records and no fictional S2 scores
        run: |
          python -m unittest tests/test_s2_credit_29c.py
          python -m unittest tests/test_factor_evidence_29a.py
          python scripts/collect_s2_credit_29c.py
          python scripts/build_factor_evidence_29a.py
          python - <<'PY'
          import csv,json
          meta=json.load(open('site/data/s2_credit_meta_29c.json'))
          model=json.load(open('site/data/factor_evidence_meta_29a.json'))
          credit=list(csv.DictReader(open('site/data/s2_credit_snapshot_29c.csv')))
          assert meta['fresh_records']>200, 'official credit-trading providers returned insufficient data'
          assert meta['stocks_observed']==len(credit)
          assert model['per_factor']['S2']['partial']>100
          assert model['per_factor']['S2']['verified']==0
          assert not meta['retail_account_ownership_directly_measured']
          assert not meta['per_stock_daytrade_volume_available']
          assert not meta['factor_scores_enabled'] and not meta['probabilities_enabled']
          assert all(row['retail_sentiment_factor_eligible']=='false' for row in credit)
          print('2.9C TWSE/TPEx S2 source and unchanged model guardrails verified',meta['fresh_records'])
          PY
      - name: Verify authentic same-sector revenue breadth and policy provenance without I1/I2 scoring
        run: |
          python -m unittest tests/test_industry_cycle_policy_29d.py
          python -m unittest tests/test_factor_evidence_29a.py
          python -m py_compile scripts/build_industry_cycle_29d.py scripts/collect_policy_evidence_29d.py
          python scripts/build_industry_cycle_29d.py
          python scripts/collect_policy_evidence_29d.py
          python scripts/build_factor_evidence_29a.py
          python - <<'PY'
          import csv,json
          cy=json.load(open('site/data/industry_cycle_meta_29d.json'))
          po=json.load(open('site/data/industry_policy_meta_29d.json'))
          fa=json.load(open('site/data/factor_evidence_meta_29a.json'))
          rows=list(csv.DictReader(open('site/data/industry_breadth_29d.csv')))
          groups=list(csv.DictReader(open('site/data/industry_sector_breadth_29d.csv')))
          assert len(rows)==cy['stock_rows'] and len(rows)>100
          assert len(groups)==cy['sector_groups'] and cy['usable_single_month_groups']>0
          assert cy['semi_group_breadth_descriptive']>0
          assert cy['industry_cycle_stage_verified'] is False
          assert cy['I1_factor_eligible'] is False
          assert po['official_listings_checked']==2 and not po['I2_factor_eligible']
          assert not po['mapping_company_sector_impact_verified']
          assert fa['per_factor']['I1']['partial']>0
          assert fa['per_factor']['I1']['verified']==0
          assert fa['per_factor']['I2']['verified']==0
          assert fa['model_eligible_stocks']==0 and fa['count_verified_factors']==0
          assert fa['policy_event_to_company_impact_verified'] is False
          print('2.9D sector revenue and official policy registry checked',cy['stock_rows'],cy['sector_groups'],po['status_by_event'])
          PY
      - name: Validate F2 peer valuation and F3 governance on official exchange snapshots
        run: |
          python -m unittest tests/test_f2f3_29e.py
          python -m unittest tests/test_factor_evidence_29a.py
          python -m py_compile scripts/collect_f2f3_29e.py
          python scripts/collect_f2f3_29e.py
          python scripts/build_factor_evidence_29a.py
          python - <<'PY'
          import csv,json
          meta=json.load(open('site/data/company_f2f3_meta_29e.json'))
          factors=json.load(open('site/data/factor_evidence_meta_29a.json'))
          vals=list(csv.DictReader(open('site/data/f2_valuation_29e.csv')))
          gov=list(csv.DictReader(open('site/data/f3_governance_29e.csv')))
          assert len(vals)==meta['valuation_stocks'] and len(vals)>500
          assert len(gov)==meta['governance_stocks'] and len(gov)>500
          assert meta['valuation_peer_comparable']>100
          assert factors['per_factor']['F2']['partial']>100
          assert factors['per_factor']['F2']['verified']==0
          assert factors['per_factor']['F3']['verified']==0
          assert not meta['F2_expected_earnings_surprise_verified']
          assert not meta['F3_governance_quality_factor_verified']
          assert factors['count_verified_factors']==0 and factors['model_eligible_stocks']==0
          assert all(x['factor_F2_eligible']=='false' for x in vals)
          assert all(x['factor_F3_eligible']=='false' for x in gov)
          print('2.9E official F2/F3 and original 12 factor evidence passed',meta['valuation_stocks'],meta['governance_stocks'],meta['valuation_peer_comparable'])
          PY
      - name: Check immutable observation versions and F2/F3 publication-time gates
        run: |
          python -m unittest tests/test_fundamental_pit_29f.py
          python -m unittest tests/test_factor_evidence_29a.py
          python -m py_compile scripts/audit_f2f3_pit_29f.py
          python scripts/audit_f2f3_pit_29f.py
          python scripts/build_factor_evidence_29a.py
          python - <<'PY'
          import csv,json
          meta=json.load(open('site/data/pit_f2f3_meta_29f.json'))
          original=json.load(open('site/data/factor_evidence_meta_29a.json'))
          rows=list(csv.DictReader(open('site/data/pit_f2f3_stock_29f.csv')))
          versions=list(csv.DictReader(open('site/data/pit_f2f3_source_versions_29f.csv')))
          assert meta['whole_universe_stocks']==len(rows) and len(rows)>1000
          assert meta['source_version_rows']==len(versions) and len(versions)>1000
          assert meta['strict_backtest_eligible']==0
          assert meta['three_clock_policy']['verified_publication_at_utc'] is None
          assert meta['factors']['F2']['first_observed_after_price_cutoff']>100
          assert meta['factors']['F3']['source_report_after_price']>100
          assert all(row['F2_usable_for_backtest']=='false' and row['F3_usable_for_backtest']=='false' for row in rows)
          assert all(row['historical_backtest_eligible']=='false' for row in versions)
          assert original['count_verified_factors']==0 and original['model_eligible_stocks']==0
          assert original['price_after_asof_excluded_from_eligibility'] is True
          print('2.9F three clock version ledger verified',len(rows),len(versions),meta['factors'])
          PY
      - name: Install browser test runtime (bounded download, no unnecessary apt refresh)
        timeout-minutes: 8
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium
      - name: Include published company master for browser test
        run: cp history_data/ordinary_stock_master.csv site/data/ordinary_stock_master.csv
      - name: Validate 12-factor manifest
        run: |
          python -c "import json; d=json.load(open('site/data/factor_readiness_28a.json')); assert len(d['factors']) == 12 and not d['probability_enabled'] and not d['live_factor_score_enabled']"
      - name: Browser smoke test against generated site
        run: |
          python scripts/export_chip_trends.py
          python -m http.server 8765 --directory site >/tmp/mfds-http.log 2>&1 &
          node tests/browser_26b.cjs
